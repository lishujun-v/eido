<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>专家 Agent 页面 · 设计对比</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #10233e; color: #eef7ff; font: 600 14px/1.4 system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 100vh; padding: 12px; }
      figure { margin: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.24); border-radius: 14px; background: #dceeff; }
      figcaption { padding: 10px 14px; background: #173252; letter-spacing: .08em; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>REFERENCE · 1672 × 941</figcaption><img src="/qa/source-agent-directory-reference.png" alt="参考设计" /></figure>
      <figure><figcaption>IMPLEMENTATION · 1672 × 941</figcaption><img src="/qa/implementation-agent-directory.png" alt="实现页面" /></figure>
    </main>
  </body>
</html>
