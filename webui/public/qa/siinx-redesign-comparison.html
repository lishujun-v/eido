<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SiinX Design QA Comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; background: #091426; color: #fff; font: 600 14px/1.4 system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      figure { margin: 0; min-width: 0; }
      figcaption { margin-bottom: 10px; color: #bcd3f5; letter-spacing: .08em; }
      img { display: block; width: 100%; height: auto; border: 1px solid #36527a; border-radius: 12px; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>REFERENCE · 1742 × 903</figcaption>
        <img src="/qa/source-siinx-reference.png" alt="Reference design" />
      </figure>
      <figure>
        <figcaption>IMPLEMENTATION · 1760 × 900</figcaption>
        <img src="/qa/implementation-siinx-redesign.jpg" alt="Browser-rendered implementation" />
      </figure>
    </main>
  </body>
</html>
