<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>短剧制作</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="brand"><b><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM10 9l5 3-5 3z"></path></svg></b>短剧制作</div><span class="auto"><i></i>自动接续已开启</span><button id="renderAll" class="primary">生成全部镜头 <svg viewBox="0 0 24 24"><path d="m9 5 10 7-10 7z"></path></svg></button></header><div class="layout"><aside><div class="sidehead"><div>分镜 <small id="count"></small></div><button id="add" title="添加分镜"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></button></div><ol id="scenes"></ol><p class="hint">每个镜头会承接上一个镜头的结尾，保持角色、空间与光线连续。</p></aside><section class="editor"><div class="heading"><div><small id="number"></small><h1 id="heading"></h1></div><div><button id="up" title="上移"><svg viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"></path></svg></button><button id="down" title="下移"><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"></path></svg></button><button id="del">删除</button></div></div><p class="link" id="continuity"></p><div class="fields"><label>镜头名称<input id="title" maxlength="50"></label><label>时长<select id="duration"><option value="3">3 秒</option><option value="5">5 秒</option><option value="8">8 秒</option></select></label></div><label>分镜描述<textarea id="prompt" maxlength="1000" placeholder="描述人物、环境、动作和镜头运动。"></textarea><small><span id="words">0</span> / 1000</small></label><section class="reference"><div><b>参考画面</b><small>可选，用作此镜头的构图和角色依据</small></div><label id="drop" for="image"><input id="image" type="file" accept="image/png,image/jpeg,image/webp" hidden><span class="upload"><svg viewBox="0 0 24 24"><path d="M12 16V4M7.5 8.5 12 4l4.5 4.5M5 20h14"></path></svg></span><span><b>添加此镜头的参考图</b><small>拖入图片，或从设备选择</small></span><span id="preview" class="image" hidden></span><button id="remove" hidden>×</button></label></section><div class="motion"><b>镜头运动</b><span id="motions"><button>缓慢推进</button><button>跟随主体</button><button>横向摇镜</button></span></div><footer><small>已保存到当前浏览器</small><button id="regen" class="primary">重新生成此镜头</button></footer></section><aside class="film"><div class="sidehead"><div>成片预览 <small id="total"></small></div><small id="state">待生成</small></div><div class="player" id="player"><div id="visual"><div></div><img id="filmImage" hidden></div><button id="play" aria-label="播放"><svg viewBox="0 0 24 24"><path d="m9 5 10 7-10 7z"></path></svg></button><p><span id="now"></span><span id="time"></span></p></div><div id="timeline"></div><p class="hint">分镜按当前顺序自动拼接。重新生成一个镜头不会影响其他已完成镜头。</p><div class="film-actions"><button id="fromStart">从头播放</button><button id="focus">定位当前镜头</button></div></aside></div></main><script src="app.js"></script></body></html>
